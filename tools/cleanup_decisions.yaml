# Bogus entities to delete outright (pass-1 hallucinations etc.)
entity_deletions:
  # 'Spray' is a pass-1 hallucination from the spell name 'color spray' in
  # faction_war.md (case-insensitive regex matched 'spray' inside 'color spray').
  # Description was generated assuming Spray is a character; the actual
  # character at the Armory is Spragg. Deleting rather than merging so 'Spray'
  # doesn't become a (false) alias of Spragg.
  - "Spray"
  # 0 doc occurrences across all OCR; Clueless is the real concept entity.
  - "Suicide of the Clueless"
  # 0 doc occurrences across all OCR; Quake's Place is the real tavern (Quake Lavender's).
  - "Jakke's Place"
  # OCR artifact: the digit '8' picked up from stat blocks (HD 8, F8, etc.) became
  # an "entity". Cross-references in 27 docs are all coincidental substring hits;
  # no real character. Detected via tools/find_degenerate_entities.py.
  - "8"


# Canonical renames. Old name auto-added to aliases so document scans still hit it.
canonical_renames:
  # Make creature-type plural canonicals into propcase singular (Camille's preference).
  - from: "Marraenoloths"
    to: "Marraenoloth"
  - from: "facet"
    to: "Facet"
  - from: "wavefire"
    to: "Wavefire"
  - from: "diakk"
    to: "Diakk"
  - from: "proxy"
    to: "Proxy"
  - from: "Plague-Mort Arch-Lector"          # rename merged entity to its most-used OCR spelling
    to: "Byrri Yarmoril"


# Specific aliases to remove from an entity (use for wrong/bogus aliases that
# shouldn't trigger windowing for this entity).
alias_removals:
  # ── Wave 2A: aliases that shouldn't be aliases ──
  - canonical: "Guardians"                   # creature 'Caretaker' is separate; both share 'Caretakers' alias
    alias: "Caretakers"
  - canonical: "Fated"                       # 'Heartless Hall' is the Fated's HQ ('Rowan's Hall'), separate place entity
    alias: "Heartless Hall"
  - canonical: "Mercykillers"                # 'Sons of Mercy' is the pre-Upheaval predecessor faction, separate entity
    alias: "Sons of Mercy"

  # ── Wave 2B: Hades cluster — Hades (deity), Underworld (Pluton location),
  #            Pluton (Gray Waste layer), Gray Waste (plane) are all separate ──
  - canonical: "Gray Waste"                  # Hades is the Greek deity entity, not a name for the plane
    alias: "Hades"
  - canonical: "Hades"                       # Underworld is its own entity (Hades' realm in Pluton)
    alias: "Underworld"
  - canonical: "Underworld"                  # Pluton is its own entity (the Gray Waste layer)
    alias: "Pluton"
  - canonical: "Ysgard"                      # Gladsheim is Odin's hall in Asgard, separate place
    alias: "Gladsheim"

  # ── Wave 2C: layer-vs-plane (each layer is its own entity) ──
  - canonical: "The Beastlands"
    alias: "Krigala"
  - canonical: "Acheron"
    alias: "Avalas"
  - canonical: "Acheron"                     # Battleplains has no separate entity, but the alias collides w/ Avalas
    alias: "Battleplains"
  - canonical: "Gehenna"
    alias: "Khalas"
  - canonical: "Gray Waste"
    alias: "Oinos"
  - canonical: "Mechanus"
    alias: "Regulus"
  - canonical: "Baator"                      # Lords of the Nine are the rulers, not the plane
    alias: "Lords of the Nine"
  - canonical: "The Abyss"
    alias: "Plain of Infinite Portals"
  - canonical: "Sigil"                       # Cagers are the residents (separate entity)
    alias: "Cagers"

  # ── Wave 2D: Ethereal regions are separate sub-entities ──
  - canonical: "Ethereal Plane"
    alias: "Border Ethereal"
  - canonical: "Ethereal Plane"
    alias: "Deep Ethereal"

  # ── Wave 3A: false aliases on substring pairs (different entities sharing a fragment) ──
  - canonical: "nic'Epona"                   # Epona is the goddess; nic'Epona are her descendant horses
    alias: "Epona"
  - canonical: "Erin Darkflame Montgomery"   # 'Montgomery' alone is a different mage at Castle at the Edge of Time
    alias: "Montgomery"
  - canonical: "Foundry"                     # Great Foundry is a different building (Believers HQ vs Doomguard landmark)
    alias: "Great Foundry"
  - canonical: "Tonat Shar"                  # Shar is the Faerûnian power; Tonat Shar is a Harmonium lieutenant
    alias: "Shar"
  - canonical: "Zess' Forge"                 # Zess is the modron operator; the Forge is a separate place entity
    alias: "Zess"
  - canonical: "Logicus"                     # Logicus is the prime world; Logicus Prime is the modron ruler
    alias: "Logicus Prime"

  # ── Wave 3A follow-up: clean Tower-of-the-Wyrm alias absorbed by Sigil's Prison merge ──
  - canonical: "Sigil's Prison"              # different Mercykiller place; came in via the 'Prison' merge
    alias: "Tower of the Wyrm"

  # ── Wave 3B: false aliases on 'other 2-way' (different entities, similar names or shared keywords) ──
  - canonical: "Arborea"                     # Arvandor is a realm IN Arborea, separate place entity
    alias: "Arvandor"
  - canonical: "Cant"                        # Planar Common is the trade language, distinct from cant/slang
    alias: "Planar Common"
  - canonical: "Power Keys"                  # Greater Power Key is a specific subtype, separate concept entity
    alias: "greater power key"
  - canonical: "githyanki"                   # Gish is the multiclass subset, separate concept entity
