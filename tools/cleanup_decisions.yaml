  - canonical: "Tir na Og"                   # Tir fo Thuinn is a different Celtic place (underwater realm)
    alias: "Tir fo Thuinn"
  - canonical: "Great Dismal Delve"          # Sevenfold Mazework is the throne room within, separate place entity
