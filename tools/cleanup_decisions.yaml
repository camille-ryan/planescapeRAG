# Manual cleanup decisions for the entity registry.
#
# Pre-populated with my best-guess merges from the duplicate-pair scans.
# Edit before running:
#   - To change a winner: swap the names in `winner` and `losers`.
#   - To skip a merge: comment it out (prefix lines with #) or move to `keeps`.
#   - To add a merge: append to `merges`.
#
# Apply with:
#   python -m planescapeRAG.tools.apply_decisions
#
# After applying, refresh entity files and chatbot metadata:
#   python -m planescapeRAG.tools.refresh_entity_frontmatter
#   python -m planescapeRAG.chatbot.embed_entities --force-refresh --yes


# Type changes are applied first so cross-type merges below can succeed.
type_changes:
  - canonical: "spell key"            # was 'item' — should be 'concept' to merge with 'Spell Keys'
    type: concept
  - canonical: "True Name"            # was 'item' — same situation
    type: concept
  - canonical: "Hopeful"              # was 'faction' — same dustmen sect as 'Hopefuls' (concept)
    type: concept


